name: Webes App APK Generalas
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kornyezet beallitasa
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Java kornyezet beallitasa
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fuggosegek telepitese es Webes build
        run: |
          npm install
          npm run build --if-present

      - name: Android kornyezet elokeszitese (Capacitor)
        run: |
          npm install @capacitor/core @capacitor/cli
          npx cap init StykAnimate com.filippocalippo.stykanimate --web-dir=dist --dist
          npm install @capacitor/android
          npx cap add android
          npx cap sync

      - name: APK buildeles a Gradlevel
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Kesz APK feltoltese letolteshez
        uses: actions/upload-artifact@v4
        with:
          name: StykAnimate-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
