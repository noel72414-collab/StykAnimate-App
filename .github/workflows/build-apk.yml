name: Webes App APK Generalas

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kornyezet beallitasa
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Java kornyezet beallitasa
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Fuggosegek telepitese
        run: npm install

      - name: Ideiglenes web mappa letrehozasa (Javitott)
        run: |
          mkdir www
          # Az rsync segítségével átmásoljuk a fájlokat, de kizárjuk a felesleges mappákat
          rsync -av --exclude='node_modules' --exclude='android' --exclude='www' --exclude='.git' ./ www/

      - name: Android kornyezet elokeszitese (Capacitor)
        run: |
          npm install @capacitor/core @capacitor/cli
          npx cap init StykAnimate com.filippocalippo.stykanimate --web-dir=www
          npm install @capacitor/android
          npx cap add android
          npx cap sync

      - name: APK buildeles a Gradlevel
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Kesz APK feltoltese letolteshez
        uses: actions/upload-artifact@v4
        with:
          name: StykAnimate-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
